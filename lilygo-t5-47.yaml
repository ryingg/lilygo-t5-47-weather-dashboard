        } else if (id(hourly_forecast_condition_1).state == "partlycloudy") {
          if (atoi(id(hourly_forecast_time_1).state.c_str()) < 7 || atoi(id(hourly_forecast_time_1).state.c_str()) >= 19) {
            it.printf(x_weather, y_weather, id(fa_icons), TextAlign::CENTER, "\U0000f6c3");
          } else {
